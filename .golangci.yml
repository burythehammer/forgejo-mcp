version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    # Dependency rule (docs/adr/0003, DEVELOPER.md "Dependency rule"). Module
    # prefix: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal.
    # Production files are held to every rule. Test files are held to the
    # mcp-go and SDK bans only, because they wire the fake and the port bridges
    # to drive the use cases and adapters under test. operation.go is the
    # composition root (Run builds the SDK factory and calls transport.Serve),
    # so it is exempt from the operation rule.
    depguard:
      rules:
        app:
          files:
            - "**/internal/app/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/app
            - forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/forge
            - forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/ptr
            - forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/numarg
            - forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/diff
          deny:
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/forge/
              desc: use cases reach Forgejo through the port package, never its adapters
        app-tests:
          files:
            - "**/internal/app/**/*_test.go"
          deny:
            - pkg: github.com/mark3labs/mcp-go
              desc: use cases are MCP-free
            - pkg: codeberg.org/mvdkleijn/forgejo-sdk
              desc: use cases are SDK-free
        operation:
          files:
            - "**/internal/operation/**"
            - "!$test"
            - "!**/internal/operation/operation.go"
          deny:
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/forge/sdk
              desc: MCP adapters reach Forgejo through the port, not the SDK adapter
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/forge/fake
              desc: the fake adapter is for tests
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/transport
              desc: the serve loop is wired only by the composition root
        transport:
          files:
            - "**/internal/transport/**"
          deny:
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/operation
              desc: the serve loop does not know tool logic
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/app
              desc: the serve loop does not know use cases
        port:
          files:
            - "**/internal/forge/*.go"
          deny:
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/operation
              desc: the port sits below its callers
            - pkg: forgejo.burythehammer.com/burythehammer/forgejo-mcp/v4/internal/transport
              desc: the port sits below its callers
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
