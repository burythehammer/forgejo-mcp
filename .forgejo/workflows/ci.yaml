#
# PR gate: runs `make check`, the same steps as a contributor runs locally.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  check:
    # Must match a label on your Forgejo runner.
    runs-on: self-hosted
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://data.forgejo.org/actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Preinstalled on the runner when possible (the install takes ~40s).
      - name: Install golangci-lint if the runner lacks it
        run: command -v golangci-lint || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: make check
        run: PATH="$PATH:$(go env GOPATH)/bin" make check
