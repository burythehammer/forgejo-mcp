# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release: push a `vX.Y.Z` tag and this builds the binaries, checksums and SBOMs
# with goreleaser, creates the Forgejo Release, then packs and attaches the
# .mcpb bundles. How to cut one: docs/agents/releasing.md.
#
# Needs the repo Actions secret RELEASE_TOKEN: a PAT with write:repository.
name: release
on:
  push:
    tags:
      - 'v[0-9]*'
jobs:
  release:
    # No `container:` override: the runner's `self-hosted` job image already
    # has Go, jq, node, npm and npx, and a persistent Go cache. goreleaser and
    # syft are not in it, so they are fetched below (#385).
    runs-on: self-hosted
    env:
      GORELEASER_VERSION: v2.12.0
      SYFT_VERSION: v1.30.0
    steps:
      - name: Install tools
        run: |
          set -eu
          bin="${RUNNER_TEMP:-/tmp}/bin"
          mkdir -p "${bin}" "${bin}/dl"
          cd "${bin}/dl"
          case "$(uname -m)" in
            x86_64) gr_arch=x86_64; syft_arch=amd64 ;;
            aarch64) gr_arch=arm64; syft_arch=arm64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac

          # fetch <url> <checksums-url> <file>: download and verify against the
          # release's published checksums file.
          fetch() {
            curl -fsSL -o "$3" "$1"
            curl -fsSL -o "$3.sums" "$2"
            grep " $3\$" "$3.sums" | sha256sum -c -
          }

          gr="goreleaser_Linux_${gr_arch}.tar.gz"
          gr_base="https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}"
          fetch "${gr_base}/${gr}" "${gr_base}/checksums.txt" "${gr}"
          tar -xzf "${gr}" goreleaser

          sy="syft_${SYFT_VERSION#v}_linux_${syft_arch}.tar.gz"
          sy_base="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          fetch "${sy_base}/${sy}" "${sy_base}/syft_${SYFT_VERSION#v}_checksums.txt" "${sy}"
          tar -xzf "${sy}" syft

          mv goreleaser syft "${bin}/"
          echo "${bin}" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: goreleaser
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: goreleaser release --clean
      - name: Pack and attach the .mcpb bundles
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          id=$(curl -fsS -H "Authorization: token ${TOKEN}" "${api}/releases/tags/${tag}" | jq -r .id)
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${platform%/*}" GOARCH="${platform#*/}"
            make mcpb
            f=$(ls dist/forgejo-mcp_*_"${GOOS}_${GOARCH}".mcpb)
            curl -fsS -X POST -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f}" \
              "${api}/releases/${id}/assets?name=$(basename "$f")"
          done
