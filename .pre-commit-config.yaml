repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: >-
          Rewrite unformatted Go files. Mirrors the gofmt-check step in
          .tekton/tasks/go-ci.yaml so import-order drift fails here instead
          of in CI.
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: openspec-validate
        name: openspec validate --all --strict
        description: >-
          Mirrors the validate step in .tekton/tasks/openspec-validate.yaml so
          a malformed change delta fails here instead of in CI. Skips when
          openspec is not installed.
        entry: scripts/ci/openspec-validate.sh
        language: script
        pass_filenames: false
        files: ^(openspec/.*\.md|openspec/config\.yaml|scripts/ci/openspec-validate\.sh)$

      - id: check-api-path-escaping
        name: check raw-HTTP API path escaping
        description: >-
          Reject API paths built with fmt.Sprintf instead of
          forge.APIPath(), which escapes every segment. Mirrors the
          api-path-escaping step in .tekton/tasks/go-ci.yaml.
        entry: scripts/ci/check-api-path-escaping.sh
        language: script
        pass_filenames: false
        files: ^(internal/operation/.*\.go|internal/(forge|config|log|ptr|to|diff|upload|jwtissuer|oauthrs)/.*\.go|scripts/ci/check-api-path-escaping\.sh)$

      - id: check-readme-tool-coverage
        name: check docs/reference documents every tool and resource
        description: >-
          Reject a registered tool or forgejo:// resource template with no row
          in docs/reference/tools.md or docs/reference/resources.md. Mirrors the
          readme-tool-coverage step in .tekton/tasks/go-ci.yaml.
        entry: scripts/ci/check-readme-tool-coverage.sh
        language: script
        pass_filenames: false
        files: ^(internal/operation/.*\.go|docs/reference/(tools|resources)\.md|scripts/ci/check-readme-tool-coverage\.sh)$

      - id: check-spdx-headers
        name: check SPDX headers on Go and shell sources
        description: >-
          Reject a tracked .go or .sh file with no SPDX-License-Identifier
          line. Mirrors the spdx-headers step in .tekton/tasks/go-ci.yaml.
        entry: scripts/ci/check-spdx-headers.sh
        language: script
        pass_filenames: false
        files: ^.*\.(go|sh)$

      - id: check-stale-names
        name: check live docs for removed pkg/forgejo names
        description: >-
          Reject forgejo.Client(, DoJSON, DoAPIRaw or SetClientForTesting in
          live specs and docs. Mirrors the stale-names step in
          .tekton/tasks/go-ci.yaml.
        entry: scripts/ci/check-stale-names.sh
        language: script
        pass_filenames: false
        files: ^(openspec/specs/.*|AGENTS\.md|DEVELOPER\.md|scripts/ci/check-stale-names\.sh)$

      - id: check-conflict-markers
        name: check for merge-conflict markers
        description: >-
          Reject committed conflict markers. Mirrors the conflict-markers step
          in .tekton/tasks/go-ci.yaml.
        entry: scripts/ci/check-conflict-markers.sh
        language: script
        pass_filenames: false

      - id: check-skills-lock
        name: check skills-lock.json matches .agents/skills
        description: >-
          Reject a vendored skill directory with no skills-lock.json entry,
          or a lock entry with no directory.
        entry: scripts/ci/check-skills-lock.sh
        language: script
        pass_filenames: false
        files: ^(\.agents/skills/.*|skills-lock\.json|scripts/ci/check-skills-lock\.sh)$

      - id: check-doc-tool-names
        name: check agent docs cite only registered tools
        description: >-
          Reject an mcp__forgejo__ name, or a tool-like name in docs/agents/,
          that is not a registered tool. Not mirrored in
          .tekton/tasks/go-ci.yaml.
        entry: scripts/ci/check-doc-tool-names.sh
        language: script
        pass_filenames: false
        files: ^(internal/operation/.*\.go|AGENTS\.md|README\.md|docs/.*\.md|scripts/ci/check-doc-tool-names\.sh)$

      - id: check-demos
        name: check anchored spec demos
        description: Validate anchored Showboat demos against their specs.
        entry: scripts/ci/check-spec-demo-anchors.sh
        language: script
        pass_filenames: false
        files: ^(openspec/.*\.(spec|demo)\.md|openspec/.*/(spec|demo)\.md|scripts/ci/check-spec-demo-anchors\.sh)$
